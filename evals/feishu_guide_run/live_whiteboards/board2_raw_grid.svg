<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 4 L0 8 z" fill="#0A0A0A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1680" height="980" fill="#FFFFFF"/>
  <rect x="60" y="52" width="1560" height="108" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="96" y="102" font-size="34" font-weight="700" fill="#0A0A0A">skill-creator-pro 的功能与流程</text>
  <text x="96" y="138" font-size="18" font-weight="500" fill="#333333">从一句需求，到飞书指南、画板与 Agent 安装包</text>

  <!-- grid columns -->
  <rect x="60" y="196" width="350" height="680" fill="#F2D4CF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="410" y="196" width="430" height="680" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="840" y="196" width="430" height="680" fill="#E5EDD6" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="1270" y="196" width="350" height="680" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="3"/>

  <text x="88" y="244" font-size="28" font-weight="700" fill="#0A0A0A">用户侧输入</text>
  <text x="438" y="244" font-size="28" font-weight="700" fill="#0A0A0A">系统主链路</text>
  <text x="868" y="244" font-size="28" font-weight="700" fill="#0A0A0A">内置子系统</text>
  <text x="1298" y="244" font-size="28" font-weight="700" fill="#0A0A0A">最终交付物</text>

  <text x="88" y="326" font-size="70" font-weight="800" fill="#0A0A0A">1</text>
  <text x="162" y="314" font-size="18" font-weight="700" fill="#0A0A0A">描述场景 / 补充目标输出</text>
  <text x="162" y="344" font-size="16" font-weight="500" fill="#333333">输入需求、参考资料、约束、交付要求</text>
  <text x="88" y="432" font-size="70" font-weight="800" fill="#0A0A0A">2</text>
  <text x="162" y="420" font-size="18" font-weight="700" fill="#0A0A0A">确认计划</text>
  <text x="162" y="450" font-size="16" font-weight="500" fill="#333333">在 Gate 1 确认范围、阶段和交付物</text>
  <text x="88" y="538" font-size="70" font-weight="800" fill="#0A0A0A">3</text>
  <text x="162" y="526" font-size="18" font-weight="700" fill="#0A0A0A">验收结果</text>
  <text x="162" y="556" font-size="16" font-weight="500" fill="#333333">在 Gate 2 验收测试、评审、安全与最终交付</text>

  <text x="438" y="312" font-size="66" font-weight="800" fill="#0A0A0A">1</text>
  <text x="510" y="302" font-size="18" font-weight="700" fill="#0A0A0A">生成 clarification-summary</text>
  <text x="510" y="330" font-size="16" font-weight="500" fill="#333333">目标 / 输入 / 输出 / 约束 / 验收标准</text>
  <text x="438" y="418" font-size="66" font-weight="800" fill="#0A0A0A">2</text>
  <text x="510" y="408" font-size="18" font-weight="700" fill="#0A0A0A">检查可复用 skill / source-map</text>
  <text x="510" y="436" font-size="16" font-weight="500" fill="#333333">判断 simple / complex，建立复用路径</text>
  <text x="438" y="524" font-size="66" font-weight="800" fill="#0A0A0A">3</text>
  <text x="510" y="514" font-size="18" font-weight="700" fill="#0A0A0A">初始化执行骨架</text>
  <text x="510" y="542" font-size="16" font-weight="500" fill="#333333">task_plan / findings / progress / execution-state</text>
  <text x="438" y="630" font-size="66" font-weight="800" fill="#0A0A0A">4</text>
  <text x="510" y="620" font-size="18" font-weight="700" fill="#0A0A0A">实现、验证、评审、安全检查</text>
  <text x="510" y="648" font-size="16" font-weight="500" fill="#333333">持续更新证据，未验证不得宣称完成</text>
  <text x="438" y="736" font-size="66" font-weight="800" fill="#0A0A0A">5</text>
  <text x="510" y="726" font-size="18" font-weight="700" fill="#0A0A0A">生成飞书指南 / 画板 / 命令计划</text>
  <text x="510" y="754" font-size="16" font-weight="500" fill="#333333">最后完成 Agent 安装包打包</text>

  <text x="868" y="322" font-size="18" font-weight="700" fill="#0A0A0A">Clarification Engine</text>
  <text x="868" y="350" font-size="16" font-weight="500" fill="#333333">显式澄清，而不是静默脑补</text>
  <line x1="868" y1="372" x2="1230" y2="372" stroke="#0A0A0A" stroke-width="3"/>
  <text x="868" y="426" font-size="18" font-weight="700" fill="#0A0A0A">Execution Spine</text>
  <text x="868" y="454" font-size="16" font-weight="500" fill="#333333">Gate 1 / Gate 2 + verify 主链路</text>
  <line x1="868" y1="476" x2="1230" y2="476" stroke="#0A0A0A" stroke-width="3"/>
  <text x="868" y="530" font-size="18" font-weight="700" fill="#0A0A0A">Lark Delivery</text>
  <text x="868" y="558" font-size="16" font-weight="500" fill="#333333">飞书文档与请求封装</text>
  <line x1="868" y1="580" x2="1230" y2="580" stroke="#0A0A0A" stroke-width="3"/>
  <text x="868" y="634" font-size="18" font-weight="700" fill="#0A0A0A">Chart Delivery</text>
  <text x="868" y="662" font-size="16" font-weight="500" fill="#333333">默认介绍板 + 轻量图表流水线</text>
  <line x1="868" y1="684" x2="1230" y2="684" stroke="#0A0A0A" stroke-width="3"/>
  <text x="868" y="738" font-size="18" font-weight="700" fill="#0A0A0A">Packaging</text>
  <text x="868" y="766" font-size="16" font-weight="500" fill="#333333">quick_validate / package_skill / package_agent_install</text>

  <text x="1298" y="314" font-size="18" font-weight="700" fill="#0A0A0A">skill 目录</text>
  <text x="1298" y="364" font-size="18" font-weight="700" fill="#0A0A0A">test / review / security 摘要</text>
  <text x="1298" y="414" font-size="18" font-weight="700" fill="#0A0A0A">飞书使用指南</text>
  <text x="1298" y="464" font-size="18" font-weight="700" fill="#0A0A0A">两张介绍画板</text>
  <text x="1298" y="514" font-size="18" font-weight="700" fill="#0A0A0A">Agent 安装 zip 与 manifest</text>

  <rect x="520" y="832" width="220" height="34" fill="#0A0A0A"/>
  <rect x="510" y="822" width="220" height="34" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="528" y="845" font-size="18" font-weight="700" fill="#0A0A0A">Gate 1：计划确认</text>
  <rect x="920" y="832" width="220" height="34" fill="#0A0A0A"/>
  <rect x="910" y="822" width="220" height="34" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="928" y="845" font-size="18" font-weight="700" fill="#0A0A0A">Gate 2：交付验收</text>

  <line x1="410" y1="536" x2="438" y2="536" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="840" y1="536" x2="868" y2="536" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1270" y1="536" x2="1298" y2="536" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
